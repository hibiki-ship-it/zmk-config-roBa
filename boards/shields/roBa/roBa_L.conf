CONFIG_ZMK_KEYBOARD_NAME="roBa"
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_BLE=y

# 親機側でマウス入力を処理するために必須の設定
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# 修正1: メモリ消費を抑え動作を安定させるため、Studioは一旦無効化を推奨
CONFIG_ZMK_STUDIO=n
CONFIG_ZMK_STUDIO_LOCKING=n

# ===============================================
# 【重要】親機側のフリーズ・パンクを防ぐための限界拡張
# ===============================================

# 1. システムメモリと処理待ち行列の最大化
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_ZMK_EVENTS_QUEUE_SIZE=2048

# 2. Bluetooth受信・送信のパイプを大幅に太くする（土管化）
# 右手から来る高感度マウスの座標データの洪水を受け止めます
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_CTLR_TX_BUFFERS=10
CONFIG_BT_BUF_ACL_RX_SIZE=251
